openapi: 3.1.0
info:
  title: CloudMeter API
  version: 0.1.0
servers:
  - url: /api
paths:
  /pricing/catalog:
    get:
      operationId: publicPricingCatalog
      description: Returns every currently effective global price with its billing unit.
      responses:
        '200': {description: Current global pricing catalog}
  /system/settings:
    get:
      operationId: getSystemSettingsPublic
      responses:
        '200': {description: "Public platform branding, content, server address, and application domain settings"}
  /pricing:
    get:
      operationId: getPricingPublic
      responses:
        '200': {description: Current public unit prices keyed by usage code}
  /faqs:
    get:
      operationId: listFAQs
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Enabled FAQs ordered for users}
  /sidebar-visibility:
    get:
      operationId: sidebarVisibility
      security: [{bearerAuth: []}]
      responses: {'200': {description: Persisted user-console navigation visibility}}
  /admin/settings/sidebar-visibility:
    put:
      operationId: updateSidebarVisibility
      security: [{bearerAuth: []}]
      responses: {'200': {description: All user-console menu visibility values persisted and audited}}
  /admin/faqs:
    get:
      operationId: adminListFAQs
      security: [{bearerAuth: []}]
      responses: {'200': {description: All FAQs including disabled entries}}
    post:
      operationId: createFAQ
      security: [{bearerAuth: []}]
      responses: {'201': {description: FAQ created and audited}}
  /admin/faqs/{faqID}:
    put:
      operationId: updateFAQ
      security: [{bearerAuth: []}]
      parameters:
        - {name: faqID, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: "FAQ content, order, or enabled state updated"}}
    delete:
      operationId: deleteFAQ
      security: [{bearerAuth: []}]
      parameters:
        - {name: faqID, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: FAQ deleted and audited}}
  /homepage:
    get:
      operationId: getHomepage
      responses:
        '200': {description: Public sanitized homepage source content}
  /healthz:
    get:
      operationId: health
      responses:
        '200': {description: Healthy}
  /setup/status:
    get:
      operationId: setupStatus
      responses:
        '200':
          description: Initialization state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatus'}
  /setup/initialize:
    post:
      operationId: initialize
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InitializeRequest'}
      responses:
        '201':
          description: Initialized and authenticated
          content:
            application/json:
              schema:
                type: object
                required: [initialized, token, expiresAt]
                properties:
                  initialized: {type: boolean}
                  token: {type: string}
                  expiresAt: {type: string, format: date-time}
        '409': {description: Already initialized}
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated}
        '401': {description: Invalid credentials}
  /auth/logout:
    post:
      operationId: logout
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Current session revoked}
        '401': {description: Session invalid or expired}
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: Registered}
        '409': {description: Registration unavailable or email already exists}
  /auth/registration-policy:
    get:
      operationId: registrationPolicy
      responses:
        '200': {description: Public registration and email policy}
  /auth/verification-code:
    post:
      operationId: sendVerificationCode
      responses:
        '200': {description: Verification code sent}
        '403': {description: Email policy rejected}
        '429': {description: Per-email or per-IP verification rate limit exceeded}
        '503': {description: SMTP is not configured}
  /auth/oauth/providers:
    get:
      operationId: oauthProviders
      responses:
        '200': {description: Enabled OAuth providers}
  /auth/oauth/{provider}/start:
    post:
      operationId: oauthStart
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [github, linuxdo]}}
      responses:
        '200': {description: Authorization URL}
        '503': {description: Provider is not configured}
  /auth/oauth/exchange:
    post:
      operationId: oauthExchange
      responses:
        '200': {description: Authenticated}
        '401': {description: OAuth result invalid or expired}
  /internal/egress/{appID}:
    post:
      operationId: ingestEgressSample
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-CloudMeter-Egress-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sampleId, byteDelta, source]
              properties:
                sampleId: {type: string}
                byteDelta: {type: integer, format: int64, minimum: 0}
                observedAt: {type: string, format: date-time}
                source: {type: string, enum: [egress_gateway, egress_proxy]}
      responses:
        '202': {description: Accepted or idempotent duplicate}
        '403': {description: Collector authentication failed}
  /internal/console-entry:
    get:
      operationId: consoleEntryGate
      parameters:
        - {name: X-CloudMeter-Entry, in: header, schema: {type: string, enum: [caddy]}}
        - {name: X-CloudMeter-Entry-Token, in: header, schema: {type: string}}
      responses:
        '204': {description: Entry is enabled for the active access mode}
        '404': {description: Entry is disabled}
  /internal/caddy/allow-domain:
    get:
      operationId: allowCaddyDomain
      parameters:
        - {name: domain, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Domain belongs to the console or an active application route}
        '403': {description: Domain is not eligible for on-demand TLS}
  /me:
    get:
      operationId: me
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user}
        '401': {description: Unauthenticated}
  /impersonation:
    delete:
      operationId: endImpersonation
      responses:
        '200': {description: Impersonation session revoked}
        '409': {description: Current session is not an impersonation session}
  /announcements:
    get:
      operationId: announcements
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active platform announcements}
  /notifications:
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user billing notifications}
  /notifications/{notificationID}/read:
    patch:
      operationId: readNotification
      security: [{bearerAuth: []}]
      parameters:
        - {name: notificationID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Notification marked read}
        '404': {description: Notification not found}
  /settings/balance-alert:
    get:
      operationId: getBalanceAlertSettings
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user's low balance alert settings}
    put:
      operationId: updateBalanceAlertSettings
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated low balance alert settings}
  /invites:
    post:
      operationId: createInvite
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Single-use invite code with a snapshotted reward}
  /invites/redeem:
    post:
      operationId: redeemInvite
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Invite redeemed and inviter rewarded through the immutable ledger}
        '409': {description: Current account already redeemed an invite}
  /admin/summary:
    get:
      operationId: adminSummary
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Administration summary}
        '403': {description: Admin role required}
  /admin/audit-logs:
    get:
      operationId: adminAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: action, in: query, schema: {type: string}}
        - {name: identity, in: query, schema: {type: string}}
        - {name: category, in: query, description: Audit category, schema: {type: string, enum: [user, admin, consumption, recharge, system, error, login, refund, management]}}
      responses:
        '200': {description: Cursor-paginated immutable audit records}
        '403': {description: Super administrator required}
  /admin/audit-logs/clear:
    post:
      operationId: clearAuditLogs
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Audit log records cleared by a super administrator}
  /billing/summary:
    get:
      operationId: billingSummary
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Wallet balance and current plan}
  /billing/ledger:
    get:
      operationId: billingLedger
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Wallet ledger entries}
  /billing/usage:
    get:
      operationId: billingUsage
      description: Returns recent usage windows with application identity and deletion state. Unpriced windows report amountCents as zero so clients can exclude them without affecting totals.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Usage windows with billing status, productSlug, and appDeleted fields; windows without a price are sealed as unpriced and are never charged retroactively}
  /billing/daily-bills:
    get:
      operationId: billingDailyBills
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Daily usage charges grouped for the current user}
  /billing/bills:
    get:
      operationId: listBillingStatements
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Monthly billing statements for the current user}
  /billing/bills/{billID}:
    get:
      operationId: billingStatementDetail
      security: [{bearerAuth: []}]
      parameters:
        - {name: billID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Immutable billing statement items and pricing snapshots}
        '404': {description: Statement not found for current user}
  /billing/bills/{billID}/export:
    get:
      operationId: exportBillingStatement
      security: [{bearerAuth: []}]
      parameters:
        - {name: billID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: UTF-8 CSV billing statement
          content:
            text/csv:
              schema: {type: string}
        '404': {description: Statement not found for current user}
  /billing/credits:
    get:
      operationId: listCredits
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Available credit grants and immutable consumption history}
  /checkin:
    get:
      operationId: checkinSummary
      description: Returns the selected Beijing-time calendar month, reward totals, reward range, and today's status.
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}
      responses: {'200': {description: Daily check-in summary and checked dates}}
    post:
      operationId: performCheckin
      description: Idempotently grants one cryptographically random wallet reward per Beijing calendar day.
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Reward appended to the immutable wallet ledger}
        '200': {description: Today's existing reward returned without another credit}
        '409': {description: Daily check-in is disabled}
  /subscriptions/plans:
    get:
      operationId: subscriptionPlans
      description: Returns the latest effective version of every self-service plan plus the current user's plan even when it is no longer publicly purchasable, together with the current subscription, transaction quote, and immutable purchase history. Subscription renewal is always user initiated; the platform does not auto-renew.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Purchasable plans and current subscription lifecycle}
  /subscriptions/purchases:
    post:
      operationId: purchaseSubscription
      description: Atomically purchases, renews, or changes a subscription using wallet balance. Active upgrades charge only the positive paid price difference; downgrades do not refund prior charges.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planVersionId, idempotencyKey]
              properties:
                planVersionId: {type: string, format: uuid}
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
      responses:
        '201': {description: "Subscription transaction committed with wallet ledger, statement item, notification, and audit record"}
        '200': {description: Existing successful purchase returned for the same idempotency key}
        '400': {description: Request validation failed}
        '404': {description: Latest effective plan version unavailable or plan is not enabled for this user's self-service purchase}
        '409': {description: Insufficient wallet balance or idempotency conflict}
  /apps:
    get:
      operationId: listApps
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "User applications including active publicPath, configured CPU and memory limits, latest point-in-time Docker CPU and memory usage, and metricsSampledAt. Runtime metrics are omitted until a fresh sample is available."}
    post:
      operationId: createApp
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, versionId, slug, idempotencyKey]
              properties:
                productId: {type: string, format: uuid}
                versionId: {type: string, format: uuid}
                slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
                domainRefreshDays:
                  type: [integer, 'null']
                  minimum: 1
                  description: Per-application subdomain rotation interval in days. Null keeps the hostname permanently unchanged.
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
                secrets:
                  type: object
                  additionalProperties: {type: string, minLength: 1, maxLength: 65536}
                  description: Values for every Secret key declared by the selected product version. Values are encrypted and never returned.
                resources:
                  type: object
                  description: User-selected overrides. The API accepts only fields explicitly enabled by the immutable product version.
                  properties:
                    cpuCores: {type: number, minimum: 0.1, maximum: 64}
                    memoryMiB: {type: number, minimum: 64, maximum: 262144}
                    containerPort: {type: integer, minimum: 1, maximum: 65535, description: Container application listening port used by health checks, gateway routing, and optional direct mapping.}
                    portMappingEnabled: {type: boolean}
                    dataVolumeGiB: {type: number, minimum: 1, maximum: 16384, description: One capacity shared by every persistent mount in this application and billed once.}
                    command: {type: array, items: {type: string}}
                    environment: {type: object, additionalProperties: {type: string}}
                    dependencies: {type: array, items: {$ref: '#/components/schemas/ProductDependency'}}
      responses:
        '201': {description: "Application, encrypted initial Secrets, immutable release, and deployment job created atomically"}
        '400': {description: "Invalid resources, slug, or missing or undeclared initial Secrets"}
        '403': {description: Product is not included in the current plan}
        '409': {description: "Subscription, application, deployment concurrency, CPU, memory, system disk, or data disk quota exceeded; or a required product dependency is unavailable"}
  /apps/{appID}:
    delete:
      operationId: deleteApp
      description: Soft-deletes an owned application, removes its route, stops billing, and queues container and persistent-volume cleanup while retaining financial and release history.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Application hidden and resource cleanup queued}
        '404': {description: Application not found}
        '409': {description: An operation is active or another application depends on this service}
  /apps/runtime-metrics:
    get:
      operationId: appRuntimeMetrics
      description: Returns fresh point-in-time Docker CPU and memory samples for the authenticated user's running applications. Samples older than 15 seconds are omitted.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Fresh runtime metrics sampled by the worker}
  /apps/{appID}/route:
    get:
      operationId: appRoute
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Active application route}
        '404': {description: Route not active}
  /apps/{appID}/stop:
    post:
      operationId: stopApp
      summary: Stop an application
      description: Atomically removes the public route and queues idempotent runtime cleanup. Persistent volumes are retained and remain billable.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
      responses:
        '202': {description: Application route removed and stop task queued}
        '200': {description: Existing stop result returned idempotently}
        '404': {description: Application not found}
        '409': {description: "Application is suspended, busy, not running, or required by another running application"}
  /apps/{appID}/start:
    post:
      operationId: startApp
      summary: Start an application
      description: Creates a new immutable release from the last successful snapshot and runs the normal health-check and route-switch workflow.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
      responses:
        '202': {description: Application start deployment queued}
        '200': {description: Existing start deployment returned idempotently}
        '403': {description: Product is no longer included in the current plan}
        '404': {description: Application not found}
        '409': {description: "Application state, subscription, dependency, Secret, deployment concurrency, ingress, or resource entitlement prevents start"}
  /apps/{appID}/backups:
    get:
      operationId: listAppBackups
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Declared volumes and backup history}
        '404': {description: App not found}
    post:
      operationId: createAppBackup
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volumeKey]
              properties:
                volumeKey: {type: string, minLength: 1}
      responses:
        '202': {description: Volume backup queued}
        '409': {description: "Backup already in progress, or storage/monthly operation quota exceeded"}
  /apps/{appID}/backups/{backupID}/restore:
    post:
      operationId: restoreAppBackup
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: backupID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
      responses:
        '202': {description: Restore queued and app entered maintenance state}
        '409': {description: Restore already in progress or idempotency key conflict}
  /apps/{appID}/backups/import:
    post:
      operationId: importAppBackup
      summary: Import a volume backup archive
      description: Validates and stores a tar.gz archive as a successful backup owned by the current user and application. Imported archives count toward the application's shared data-volume capacity and can be restored through the normal restore queue.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [volumeKey, file]
              properties:
                volumeKey: {type: string, minLength: 1}
                file: {type: string, format: binary, description: tar.gz archive up to 2 GiB}
      responses:
        '201': {description: Archive imported as a successful backup}
        '400': {description: Invalid, unsafe, empty, or oversized archive}
        '404': {description: Application not found for current user}
        '409': {description: Imported archive would exceed shared data-volume capacity}
  /apps/{appID}/backups/{backupID}/export:
    get:
      operationId: exportAppBackup
      summary: Export a successful backup archive
      description: Downloads the original tar.gz archive when it belongs to the current user and has not entered deletion.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: backupID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Backup tar.gz archive
          content:
            application/gzip:
              schema: {type: string, format: binary}
        '404': {description: Successful archive not found for current user}
  /apps/{appID}/backups/{backupID}:
    delete:
      operationId: deleteAppBackup
      summary: Delete one backup archive
      description: Queues physical archive cleanup while retaining immutable backup history and audit metadata. A failed cleanup can be retried with the same endpoint.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: backupID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Backup archive deletion queued}
        '200': {description: Backup was already physically deleted; idempotent response}
        '404': {description: Backup not found for current user}
        '409': {description: Backup creation or restore is still in progress}
  /apps/{appID}/configuration:
    get:
      operationId: appConfiguration
      summary: Read editable application configuration
      description: Returns the current successful runtime snapshot and the latest published product template. Secret values are never returned; only configured Secret key names are included.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Current configuration, latest template, route port, and configured Secret key names"}
        '404': {description: Application has no successful configuration or is not owned by the caller}
  /apps/{appID}/versions:
    get:
      operationId: appVersions
      summary: List selectable product versions for an application
      description: Returns only published, non-archived versions belonging to the application's product. Runtime and route declarations are included for configuration review; Secret values are never returned.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Selectable versions, runtime summaries, and current version identity"}
        '404': {description: Application not found or not owned by the caller}
  /apps/{appID}/access:
    post:
      operationId: createAppAccess
      summary: Establish a short-lived browser session for an owned application
      description: Sets an HttpOnly cookie scoped to /apps/. The application router validates the underlying platform session and instance ownership before every proxy request.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Access cookie established and public path returned}
        '404': {description: Active route not found or not owned by the caller}
  /apps/{appID}/logs:
    get:
      operationId: getAppLogs
      summary: Read the most recently fetched runtime logs for an owned instance
      description: Returns the latest stored container diagnostics (state plus recent stdout/stderr) and the state of the most recent log fetch job. The caller must own the application.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Latest logs and fetch job state}
        '404': {description: Application not found or not owned by the caller}
  /apps/{appID}/logs/refresh:
    post:
      operationId: requestAppLogRefresh
      summary: Queue a fresh log fetch for an owned instance
      description: Throttled request that queues a worker job to read the container diagnostics. Reuses pending jobs and caches recent successful fetches.
      security: [{bearerAuth: []}]
      parameters:
        - {name: appID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: "Log fetch queued, pending, or served from cache"}
        '404': {description: Application not found or not owned by the caller}
  /admin/plans:
    get:
      operationId: adminPlans
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Plans and immutable versions}
    post:
      operationId: createPlan
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Plan created}
