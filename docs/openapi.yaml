  /admin/payments/orders/{orderID}/close:
    post:
      operationId: closePayment
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Pending payment order closed after provider confirmation}
        '503': {description: Provider close operation is not configured}
  /admin/settings/payments:
    get:
      operationId: getPaymentSettings
      security: [{bearerAuth: []}]
      responses: {'200': {description: Payment provider settings without secrets}}
  /admin/settings/checkin:
    get:
      operationId: getCheckinSettings
      security: [{bearerAuth: []}]
      responses: {'200': {description: Daily check-in enablement and reward range}}
    put:
      operationId: updateCheckinSettings
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Daily check-in settings updated}
        '400': {description: Invalid reward range}
  /admin/settings/payments/{provider}:
    put:
      operationId: updatePaymentSettings
      security: [{bearerAuth: []}]
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [manual, epay]}}
      responses: {'200': {description: Encrypted payment provider settings updated}}
  /admin/products:
    get:
      operationId: adminListProducts
      security: [{bearerAuth: []}]
      responses: {'200': {description: Product catalog including unpublished versions}}
    post:
      operationId: createProduct
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201': {description: Product created with an immutable slug and audit record}
        '409': {description: Product slug already exists}
  /admin/products/{productID}:
    delete:
      operationId: deleteProduct
      description: Removes a product from active management while preserving immutable version and audit history. Products with user application history must be retired instead.
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Product removed from the active catalog}
        '404': {description: Product not found}
        '409': {description: Product has application history or an active version test}
    patch:
      operationId: updateProduct
      description: Updates the display name while preserving the product slug and all immutable versions.
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200': {description: Product name updated idempotently and audited when changed}
        '404': {description: Product not found}
  /admin/products/{productID}/availability:
    patch:
      operationId: updateProductAvailability
      description: Soft-retires or restores a product without deleting deployed applications or immutable releases.
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: Product availability updated idempotently and audited when changed}
        '404': {description: Product not found}
        '409': {description: "Active test or a published dependent product prevents retirement, or dependencies prevent restoration"}
  /admin/products/{productID}/versions:
    post:
      operationId: createProductVersion
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProductVersionRequest'}
      responses:
        '201': {description: Immutable structured product version created}
        '400': {description: "Image, runtime, dependency, route, health, or update policy validation failed"}
  /admin/products/{productID}/versions/{versionID}:
    delete:
      operationId: archiveProductVersion
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Product version archived without changing deployed release snapshots}
        '404': {description: Product version not found}
  /admin/products/{productID}/versions/{versionID}/publish:
    post:
      operationId: publishProductVersion
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Product version published}
        '409': {description: Successful test missing or product dependency graph changed and is now invalid}
  /admin/products/{productID}/versions/{versionID}/tests:
    post:
      operationId: startProductVersionTest
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secrets:
                  type: object
                  additionalProperties: {type: string}
      responses:
        '202': {description: Isolated product-version test deployment queued}
        '400': {description: Required test secrets are missing or invalid}
        '409': {description: A test is already running or the version is already published}
  /admin/products/{productID}/versions/{versionID}/tests/{testID}/cancel:
    post:
      operationId: cancelProductVersionTest
      description: Requests forced termination of an active isolated test; the worker removes its container, health probe, and network.
      security: [{bearerAuth: []}]
      parameters:
        - {name: productID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: testID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Forced-stop request accepted}
        '200': {description: Test was already terminal}
        '404': {description: Product version test not found}
  /tickets:
    get:
      operationId: listTickets
      description: Lists support tickets owned by the current user, ordered by status, priority, and recent activity.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user's support tickets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketList'}
    post:
      operationId: createTicket
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTicketRequest'}
      responses:
        '201':
          description: Support ticket and its first message created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketCreated'}
        '400': {description: Ticket fields are incomplete or invalid}
  /tickets/{ticketID}:
    get:
      operationId: getTicket
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Ticket metadata and complete conversation owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketDetail'}
        '404': {description: Ticket not found or not owned by the current user}
  /tickets/{ticketID}/messages:
    post:
      operationId: replyTicket
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketReplyRequest'}
      responses:
        '201': {description: User reply appended and ticket reopened when appropriate}
        '404': {description: Ticket not found or not owned by the current user}
        '409': {description: Closed ticket cannot receive replies}
  /tickets/{ticketID}/close:
    post:
      operationId: closeTicket
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Ticket closed by its owner}
        '404': {description: "Ticket not found, not owned, or already closed"}
  /tickets/{ticketID}/escalate:
    post:
      operationId: escalateTicket
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Ticket escalated from AI support to a human agent}
        '404': {description: Ticket not found or not owned by the current user}
  /admin/settings/docker:
    get:
      operationId: getDockerSettings
      description: Returns desired Docker image, Registry, proxy, and pull settings together with the latest Worker-observed daemon state. Registry passwords never leave the API.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Docker settings and sanitized daemon probe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DockerSettings'}
        '403': {description: Super administrator required}
    put:
      operationId: updateDockerSettings
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDockerSettingsRequest'}
      responses:
        '200': {description: "Docker settings encrypted, saved, and audited"}
        '400': {description: "Mirror, Registry, proxy, or timeout validation failed"}
        '403': {description: Super administrator required}
  /admin/system/restart:
    get:
      operationId: getPlatformRestart
      description: Returns the latest auditable CloudMeter platform-service restart request.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Latest restart request, or null when no restart has been requested"}
        '403': {description: Administrator required}
    post:
      operationId: createPlatformRestart
      description: Queues a fixed-scope restart of Gateway, Web, API, App Router, Egress Proxy, and Worker. PostgreSQL, Redis, Docker Engine, and user application containers are excluded.
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Platform restart queued and audited}
        '403': {description: Administrator required}
        '409': {description: Another platform restart is queued or running}
  /admin/users:
    get:
      operationId: listUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: username, in: query, required: false, description: Case-insensitive partial match against the account display name, schema: {type: string, maxLength: 80}}
      responses: {'200': {description: Administration user list}}
    post:
      operationId: adminCreateUser
      security: [{bearerAuth: []}]
      responses: {'201': {description: User or administrator account created}}
  /admin/users/{userID}/status:
    patch:
      operationId: updateUserStatus
      security: [{bearerAuth: []}]
      parameters:
        - {name: userID, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: User status updated}}
  /admin/users/{userID}/role:
    patch:
      operationId: updateUserRole
      description: Switches a non-super-administrator account between ordinary user and administrator while retaining the shared user console.
      security: [{bearerAuth: []}]
      parameters:
        - {name: userID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {type: string, enum: [user, admin]}
      responses:
        '200': {description: Account role switched and existing sessions observe the change}
        '404': {description: User not found}
        '409': {description: Super administrator role is protected}
  /admin/users/{userID}/wallet/adjust:
    post:
      operationId: adjustWallet
      security: [{bearerAuth: []}]
      parameters:
        - {name: userID, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Idempotent immutable wallet adjustment recorded}}
  /admin/users/{userID}/credits:
    post:
      operationId: grantCredit
      security: [{bearerAuth: []}]
      parameters:
        - {name: userID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Expiring or permanent credit grant created}
        '200': {description: Identical business reference replayed idempotently}
        '403': {description: Super administrator required}
        '409': {description: Business reference conflicts with different parameters}
  /admin/settings/mail/test:
    post:
      operationId: testMailSettings
      security: [{bearerAuth: []}]
      responses: {'200': {description: SMTP test message sent}}
  /admin/settings/oauth:
    get:
      operationId: getOAuthSettings
      security: [{bearerAuth: []}]
      responses: {'200': {description: OAuth settings without secrets}}
  /admin/settings/oauth/{provider}:
    put:
      operationId: updateOAuthSettings
      security: [{bearerAuth: []}]
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [github, linuxdo]}}
      responses:
        '200': {description: Encrypted OAuth settings and LinuxDo trust policy updated}
        '409': {description: Server public URL must be configured in Website Settings before enabling OAuth}
  /admin/tickets:
    get:
      operationId: adminListTickets
      description: Lists all support tickets; an optional status filter narrows the queue.
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TicketStatus'}}
      responses:
        '200':
          description: Administrator support queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketList'}
        '403': {description: Administrator role required}
  /admin/tickets/{ticketID}:
    get:
      operationId: adminGetTicket
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Ticket metadata, requester identity, and complete conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketDetail'}
        '404': {description: Ticket not found}
  /admin/tickets/{ticketID}/messages:
    post:
      operationId: adminReplyTicket
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketReplyRequest'}
      responses:
        '201': {description: Staff reply appended and ticket moved to waiting for user}
        '404': {description: Ticket not found}
        '409': {description: Closed ticket cannot receive replies}
  /admin/tickets/{ticketID}/status:
    patch:
      operationId: adminUpdateTicketStatus
      security: [{bearerAuth: []}]
      parameters:
        - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/TicketStatus'}
      responses:
        '200': {description: Ticket status updated and audited}
        '404': {description: Ticket not found}
  /admin/announcements/{announcementID}:
    patch:
      operationId: updateAnnouncement
      security: [{bearerAuth: []}]
      parameters:
        - {name: announcementID, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Announcement publication state updated}}
  /admin/announcements:
    get:
      operationId: adminAnnouncements
      security: [{bearerAuth: []}]
      responses: {'200': {description: Announcement list}}
    post:
      operationId: createAnnouncement
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Announcement created and audited}
        '400': {description: "Invalid title, content, or severity"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    llmApiKey: {type: http, scheme: bearer, bearerFormat: CloudMeter system API key}
  schemas:
    TicketStatus:
      type: string
      enum: [open, in_progress, waiting_user, resolved, closed]
    TicketSummary:
      type: object
      additionalProperties: false
      required: [id, number, userId, requesterName, requesterEmail, subject, category, priority, status, messageCount, lastMessageAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, minimum: 1}
        userId: {type: string, format: uuid}
        requesterName: {type: string}
        requesterEmail: {type: string, format: email}
        subject: {type: string, minLength: 2, maxLength: 160}
        category: {type: string, enum: [deployment, billing, account, product, other]}
        priority: {type: string, enum: [low, normal, high, urgent]}
        status: {$ref: '#/components/schemas/TicketStatus'}
        messageCount: {type: integer, minimum: 1}
        lastMessageAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TicketMessage:
      type: object
      additionalProperties: false
      required: [id, authorId, authorName, staffReply, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        authorName: {type: string}
        staffReply: {type: boolean}
        body: {type: string, minLength: 1, maxLength: 10000}
        createdAt: {type: string, format: date-time}
    TicketList:
      type: object
      additionalProperties: false
      required: [tickets]
      properties:
        tickets:
          type: array
          items: {$ref: '#/components/schemas/TicketSummary'}
    TicketDetail:
      type: object
      additionalProperties: false
      required: [ticket, messages]
      properties:
        ticket: {$ref: '#/components/schemas/TicketSummary'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/TicketMessage'}
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [subject, category, priority, body]
      properties:
        subject: {type: string, minLength: 2, maxLength: 160}
        category: {type: string, enum: [deployment, billing, account, product, other]}
        priority: {type: string, enum: [low, normal, high, urgent]}
        body: {type: string, minLength: 1, maxLength: 10000}
    TicketReplyRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 10000}
    TicketCreated:
      type: object
      additionalProperties: false
      required: [id, number, status]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, minimum: 1}
        status: {type: string, const: open}
    UpdateDockerSettingsRequest:
      type: object
      additionalProperties: false
      required: [registryMirrors, defaultRegistry, registryUsername, registryPassword, httpProxy, httpsProxy, noProxy, pullTimeoutSeconds]
      properties:
        registryMirrors:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, format: uri, pattern: '^https://'}
        defaultRegistry: {type: string, maxLength: 512, description: Registry host with optional namespace and without a URI scheme}
        registryUsername: {type: string, maxLength: 256}
        registryPassword: {type: string, maxLength: 4096, writeOnly: true, description: Empty preserves the existing encrypted password unless the username is also cleared}
        httpProxy: {type: string, maxLength: 4096}
        httpsProxy: {type: string, maxLength: 4096}
        noProxy: {type: string, maxLength: 4096}
        pullTimeoutSeconds: {type: integer, minimum: 30, maximum: 1800}
    DockerSettings:
      type: object
      additionalProperties: false
      required: [registryMirrors, defaultRegistry, registryUsername, registryPasswordConfigured, httpProxy, httpsProxy, noProxy, pullTimeoutSeconds, detectedRegistryMirrors, detectedHttpProxy, detectedHttpsProxy, detectedNoProxy, lastCheckError, daemonRestartRequired, daemonJson]
      properties:
        registryMirrors: {type: array, items: {type: string, format: uri}}
        defaultRegistry: {type: string}
        registryUsername: {type: string}
        registryPasswordConfigured: {type: boolean}
        httpProxy: {type: string}
        httpsProxy: {type: string}
        noProxy: {type: string}
        pullTimeoutSeconds: {type: integer}
        detectedRegistryMirrors: {type: array, items: {type: string}}
        detectedHttpProxy: {type: string}
        detectedHttpsProxy: {type: string}
        detectedNoProxy: {type: string}
        lastCheckedAt: {type: [string, 'null'], format: date-time}
        lastCheckError: {type: string}
        daemonRestartRequired: {type: boolean}
        daemonJson: {type: string}
    RefundResult:
      type: object
      required: [orderId, status, balanceCents, refundId, refundStatus, idempotent]
      properties:
        orderId: {type: string, format: uuid}
        status: {type: string, const: refunded}
        balanceCents: {type: integer, format: int64}
        refundId: {type: string, format: uuid}
        refundStatus: {type: string, const: succeeded}
        ledgerEntryId: {type: integer, format: int64}
        completedAt: {type: string, format: date-time}
        idempotent: {type: boolean}
    RefundEvent:
      type: object
      required: [id, toStatus, message, metadata, createdAt]
      properties:
        id: {type: integer, format: int64}
        fromStatus: {type: [string, 'null'], enum: [processing, null]}
        toStatus: {type: string, enum: [processing, succeeded, failed]}
        message: {type: string}
        metadata: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
    RefundRecord:
      type: object
      required: [id, orderId, userId, email, displayName, provider, amountCents, status, reason, requestId, failureMessage, createdAt, events]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        provider: {type: string, enum: [manual, epay]}
        amountCents: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [processing, succeeded, failed]}
        reason: {type: string, minLength: 1, maxLength: 500}
        ledgerEntryId: {type: [integer, 'null'], format: int64}
        requestedBy: {type: [string, 'null'], format: uuid}
        requestedByEmail: {type: string}
        requestId: {type: string}
        failureMessage: {type: string}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        events:
          type: array
          items: {$ref: '#/components/schemas/RefundEvent'}
    SetupStatus:
      type: object
      required: [initialized, checks]
      properties:
        initialized: {type: boolean}
        platformName: {type: string}
        checks:
          type: object
          additionalProperties: {type: boolean}
    InitializeRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 80}
        registrationEnabled: {type: boolean}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 80}
        code: {type: string, pattern: '^[0-9]{6}$', description: Required when registration email verification is enabled}
    AppSecretMetadata:
      type: object
      additionalProperties: false
      required: [key, version, createdAt]
      properties:
        key: {type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$'}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    AppSecretList:
      type: object
      additionalProperties: false
      required: [secrets, allowedKeys]
      properties:
        secrets:
          type: array
          items: {$ref: '#/components/schemas/AppSecretMetadata'}
        allowedKeys:
          type: array
          uniqueItems: true
          description: Sorted union of Secret keys declared by published versions of this application's product
          items: {type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$'}
    PutAppSecretRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, minLength: 1, maxLength: 65536, writeOnly: true}
    AppSecretVersionCreated:
      type: object
      additionalProperties: false
      required: [key, version]
      properties:
        key: {type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$'}
        version: {type: integer, minimum: 1}
    CreateProductVersionRequest:
      type: object
      additionalProperties: false
      required: [imageDigest, runtimeSpec, routeSpec, healthSpec, updateSpec]
      properties:
        versionLabel: {type: string, maxLength: 64}
        imageDigest:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/:-]*(?::[A-Za-z0-9_][A-Za-z0-9._-]{0,127}|@sha256:[0-9a-f]{64})$'
        runtimeSpec: {$ref: '#/components/schemas/ProductRuntimeSpec'}
        routeSpec: {$ref: '#/components/schemas/ProductRouteSpec'}
        healthSpec: {$ref: '#/components/schemas/ProductHealthSpec'}
        updateSpec: {$ref: '#/components/schemas/ProductUpdateSpec'}
    ProductRuntimeSpec:
      type: object
      additionalProperties: false
      required: [cpuCores, memoryMiB, volumes, env, secretKeys]
      properties:
        cpuCores: {type: number, minimum: 0.1, maximum: 64}
        memoryMiB: {type: number, minimum: 64, maximum: 262144}
        dataVolumeGiB: {type: number, minimum: 1, maximum: 16384, description: Minimum capacity shared by all declared persistent mounts.}
        editableOptions:
          type: object
          additionalProperties: false
          properties:
            cpu: {type: boolean}
            memory: {type: boolean}
            dataVolume: {type: boolean}
            command: {type: boolean}
            dependencies: {type: boolean}
        command:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 4096}
        env:
          type: object
          maxProperties: 128
          propertyNames: {pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'}
          additionalProperties: {type: string, maxLength: 4096}
        secretKeys:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$'}
        dependencies:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/ProductDependency'}
        volumes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, mountPath, sizeGiB]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}
              mountPath: {type: string, pattern: '^/'}
              sizeGiB: {type: number, minimum: 1, maximum: 16384}
    ProductDependency:
      type: object
      additionalProperties: false
      required: [key, productId, serviceSlug, required]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}
        productId: {type: string, format: uuid}
        serviceSlug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
        required: {type: boolean}
    ProductRouteSpec:
      type: object
      additionalProperties: false
      required: [containerPort, basePath, stripPrefix, websocket, sse, cookiePath]
      properties:
        containerPort: {type: integer, minimum: 1, maximum: 65535}
        basePath: {type: string, pattern: '^/', maxLength: 512}
        stripPrefix: {type: boolean}
        websocket: {type: boolean}
        sse: {type: boolean}
        cookiePath: {type: string, pattern: '^/|^$', maxLength: 512}
    ProductHealthSpec:
      type: object
      additionalProperties: false
      required: [path, intervalSeconds, timeoutSeconds]
      properties:
        path: {type: string, pattern: '^/|^$', maxLength: 512}
        intervalSeconds: {type: integer, minimum: 1, maximum: 120}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 30}
        acceptedStatusCodes:
          type: array
          maxItems: 32
          uniqueItems: true
          description: Additional non-2xx HTTP status codes that prove an authenticated service is ready; all 2xx responses remain accepted by default.
          items: {type: integer, minimum: 100, maximum: 599}
    ProductUpdateSpec:
      type: object
      additionalProperties: false
      required: [dataPolicy]
      properties:
        dataPolicy: {type: string, enum: [stateless, volume_compatible, backup_required]}
