server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Explicit MIME types so web modules are never served as text/html even if
    # the image's default mime.types mapping is unavailable.
    types {
        text/html                             html htm;
        application/javascript                js mjs;
        text/css                              css;
        application/json                      json map;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        text/plain                            txt;
    }

    # Hashed build assets: serve the file or 404 — never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Any other static file extension must also be served directly.
    location ~* \.(js|mjs|css|json|map|svg|png|jpe?g|gif|webp|ico|woff2?|txt)$ {
        try_files $uri =404;
        expires 7d;
    }

    # SPA history fallback: only plain navigations that are not static files
    # are rewritten to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
