server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $cloudmeter_api http://api:8081;

    location = /healthz-static {
        access_log off;
        return 204;
    }

    location = /__console_gate {
        internal;
        proxy_pass $cloudmeter_api/api/internal/console-entry;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-CloudMeter-Entry $http_x_cloudmeter_entry;
        proxy_set_header X-CloudMeter-Entry-Token $http_x_cloudmeter_entry_token;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/ {
        auth_request /__console_gate;
        proxy_pass $cloudmeter_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /payments/ {
        auth_request /__console_gate;
        proxy_pass $cloudmeter_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit MIME types so web modules are never served as text/html even if
    # the image's default mime.types mapping is unavailable.
    types {
        text/html                             html htm;
        application/javascript                js mjs;
        text/css                              css;
        application/json                      json map;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        text/plain                            txt;
    }

    # Hashed build assets: serve the file or 404 — never fall back to index.html.
    location /assets/ {
        auth_request /__console_gate;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Any other static file extension must also be served directly.
    location ~* \.(js|mjs|css|json|map|svg|png|jpe?g|gif|webp|ico|woff2?|txt)$ {
        auth_request /__console_gate;
        try_files $uri =404;
        expires 7d;
    }

    # SPA history fallback: only plain navigations that are not static files
    # are rewritten to index.html.
    location / {
        auth_request /__console_gate;
        try_files $uri $uri/ /index.html;
    }
}
